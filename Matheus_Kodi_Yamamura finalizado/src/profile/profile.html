<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="../../assets/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../shared/css/styles.css">
    <link rel="stylesheet" href="../shared/css/header.css">
    <link rel="stylesheet" href="../shared/css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="profile.css">
    <title>Meu Perfil - Operação Curiosidade</title>
</head>
<body>
    <script src="../shared/js/theme.js"></script>
    <nav id="sidebar">
        <div id="logo">
            <span>OC</span><p> Operação Curiosidade</p>
        </div>
        <ul id="side_items">
            <li class="side-item">
                <a href="../dashboard/dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span class="item-description">Home</span>
                </a>
            </li>
            <li class="side-item">
                <a href="../registration-dashboard/registration-dashboard.html">
                    <i class="fa-solid fa-user-plus"></i>
                    <span class="item-description">Cadastro</span>
                </a>
            </li>
            <li class="side-item">
                <a href="../reports-dashboard/reports-dashboard.html">
                    <i class="fa-solid fa-chart-simple"></i>
                    <span class="item-description">Relatórios</span>
                </a>
            </li>
            <li class="side-item active">
                <a href="../profile/profile.html">
                    <i class="fa-solid fa-user"></i>
                    <span class="item-description">Perfil</span>
                </a>
            </li>
        </ul>
    </nav>
    
    <main>
        <header>
            <div class="header_container">
                <input type="search" class="hide" name="search" id="search" placeholder="Pesquisar...">
                <div class="user_info">
                    <button id="theme-toggle" class="theme-button">
                        <i class="fa-solid fa-moon"></i><i class="fa-solid fa-sun"></i>  
                    </button>
                    <span id="avatar"></span>
                    <a href="../profile/profile.html">
                        <span id="username"></span>
                    </a>
                    <button id="btn_logout">SAIR</button>
                </div>
            </div>
        </header>

        <section class="profile">
            <div class="profile-container">
                <h1 class="page-title">Perfil do Usuário</h1>
                <form id="profile-form" class="form-section">
                    <h2>Informações do Usuário</h2>
                    <div class="input-group">
                        <label for="iname">Nome</label>
                        <input type="text" id="iname" name="iname" >
                        <span class="error_message" id="nameError"></span>
                    </div>
                    <div class="input-group">
                        <label for="iemail">Email</label>
                        <input type="text" id="iemail" name="iemail">
                        <span class="error_message" id="emailError"></span>
                        <span class="error_message" id="profileError"></span>
                    </div>
                    <button type="submit" class="btn-primary">Salvar Alterações</button>
                </form>

                <form id="password-form" class="form-section">
                    <h2>Mudar Senha</h2>
                    <div class="input-group">
                        <label for="ipassword">Senha atual</label>
                        <input type="password" id="ipassword" name="ipassword">
                    </div>
                    <div class="input-group">
                        <label for="new-password">Nova Senha</label>
                        <input type="password" id="new-password" name="newPassword">
                        <span class="error_message" id="passwordError"></span>
                    </div>
                    <button type="submit" class="btn-primary">Atualizar Senha</button>
                </form>

                <div id="danger-zone" class="form-section">
                    <h2>Zona de Perigo</h2>
                    <p>Excluir sua conta é uma ação permanente e não pode ser desfeita.</p>
                    <button id="delete-account-btn" class="btn-danger">Excluir Minha Conta</button>
                </div>
            </div>
        </section>
    </main>
    <script src="../shared/js/auth.js"></script>
    <script src="profile.js"></script>
    <script src="../shared/js/helpers.js"></script>
    <script>
        restrictPage()
        configLogout(); 
    </script>
</body>
</html>
